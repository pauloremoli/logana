[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Keep frontend features and duplicate binary names isolated between packages.
precise-builds = true
# The release workflow adds desktop integration to generated GUI installers.
allow-dirty = ["ci", "msi"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# A GitHub repo to push Homebrew formulas to
tap = "pauloremoli/homebrew-logana"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Native GUI libraries are needed by the GNU desktop builds only.
[dist.dependencies.apt]
libfontconfig1-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libwayland-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libxkbcommon-x11-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libvulkan-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libssl-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
libclang-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
liblzma-dev = { targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"] }
