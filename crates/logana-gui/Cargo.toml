[package]
name = "logana-gui"
version = "0.7.7"
edition = "2024"
authors = ["Paulo Remoli"]
description = "GUI-only build of logana — turn any log source into structured data with a desktop app."
license = "GPL-3.0"
repository = "https://github.com/pauloremoli/logana"
homepage = "https://github.com/pauloremoli/logana"
publish = false

[package.metadata.dist]
dist = true
installers = ["shell", "powershell", "msi"]

[package.metadata.wix]
upgrade-guid = "228985CC-97EF-4EAF-9918-1E5E9771A842"
path-guid = "82724116-29A5-4E64-B062-CE0D94932DD3"
license = false
eula = false

[dependencies]
logana = { path = "../..", default-features = false, features = ["gui"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
gpui-kit = { version = "0.7", default-features = false, features = ["component", "assets"] }

[build-dependencies]
embed-resource = "3.0"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[package.metadata.deb]
section = "utils"
priority = "optional"
license-file = ["../../LICENSE", "0"]
depends = "$auto, libvulkan1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0"
conflicts = "logana-full"
assets = [
    ["target/release/logana-gui", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/logana-gui/README.md", "644"],
    ["../../assets/logana.desktop", "usr/share/applications/logana.desktop", "644"],
    ["../../assets/logana.png", "usr/share/icons/hicolor/256x256/apps/logana.png", "644"],
]
