name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            package: logana
            flags: --no-default-features
            gui: false
          - name: tui
            package: logana
            flags: ""
            gui: false
          - name: gui
            package: logana-gui
            flags: ""
            gui: true
          - name: full
            package: logana-full
            flags: ""
            gui: true
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install GUI system dependencies
      if: matrix.gui
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libclang-dev
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.name }}
    - name: Clippy
      run: cargo clippy --locked --all-targets -p ${{ matrix.package }} ${{ matrix.flags }} -- -D warnings
    - name: Build
      run: cargo build --locked -p ${{ matrix.package }} ${{ matrix.flags }}
    - name: Run tests
      run: cargo test --locked -p ${{ matrix.package }} ${{ matrix.flags }}
    - name: Verify dependency isolation
      if: matrix.name == 'core'
      run: python3 scripts/check-feature-deps.py

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Run coverage
      run: cargo tarpaulin --engine llvm --out xml --skip-clean -- --test-threads=1
    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: cobertura.xml
        fail_ci_if_error: true
    - name: Check coverage threshold
      run: |
        COVERAGE=$(cargo tarpaulin --engine llvm --skip-clean -- --test-threads=1 2>&1 | grep -oP '[\d.]+% coverage' | grep -oP '[\d.]+')
        echo "Coverage: ${COVERAGE}%"
        if [ "$(echo "$COVERAGE < 80" | bc)" -eq 1 ]; then
          echo "Coverage ${COVERAGE}% is below 80% threshold"
          exit 1
        fi
