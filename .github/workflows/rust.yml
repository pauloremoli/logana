name: Rust

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-check:
    name: Check Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Check Windows library
      run: cargo check --locked -p logana --lib --all-features

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Install GUI system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libclang-dev liblzma-dev
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            package: logana
            flags: --no-default-features
            test-flags: --no-default-features
            gui: false
          - name: tui
            package: logana
            flags: ""
            test-flags: ""
            gui: false
          - name: gui
            package: logana-gui
            flags: ""
            test-flags: --no-default-features --features logana/gui-test
            gui: true
          - name: full
            package: logana-full
            flags: ""
            test-flags: --features logana/gui-test
            gui: true
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install GUI system dependencies
      if: matrix.gui
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libclang-dev liblzma-dev
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.name }}
    - name: Clippy
      run: cargo clippy --locked --all-targets -p ${{ matrix.package }} ${{ matrix.flags }} -- -D warnings
    - name: Build
      run: cargo build --locked -p ${{ matrix.package }} ${{ matrix.flags }}
    - name: Run shared library and frontend tests
      run: cargo test --locked -p logana -p ${{ matrix.package }} ${{ matrix.test-flags }}
    - name: Verify dependency isolation
      if: matrix.name == 'core'
      run: python3 scripts/check-feature-deps.py

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install GUI system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev libclang-dev liblzma-dev
    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Run coverage
      run: cargo tarpaulin --locked --workspace --features logana/gui-test --engine llvm --timeout 600 --out xml --skip-clean --fail-under 80 -- --test-threads=1
    - name: Save coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: cobertura.xml
        if-no-files-found: ignore
    - name: Upload to Codecov
      if: ${{ !cancelled() && hashFiles('cobertura.xml') != '' }}
      uses: codecov/codecov-action@v4
      with:
        files: cobertura.xml
        fail_ci_if_error: true
