[package]
name = "logana"
version = "0.7.5"
edition = "2024"
authors = ["Paulo Remoli"]
description = "Turn any log source — files, compressed archives, Docker, or OTel streams — into structured data. Filter by pattern, field, or date range; annotate lines; bookmark findings; and export to Markdown, Jira, or AI assistants via the built-in MCP server."
license = "GPL-3.0"
repository = "https://github.com/pauloremoli/logana"
homepage = "https://github.com/pauloremoli/logana"
keywords = ["log", "tui", "viewer", "terminal", "analyzer"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = [".github", "pkg", "docs"]
default-run = "logana"

[package.metadata.wix]
upgrade-guid = "40A718EC-7645-458F-A8AB-6DE8BC5A8183"
path-guid = "0D696C66-ABEF-4551-A553-0530BA66BEC7"
license = false
eula = false

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
libc = { version = "0.2", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = { version = "0.2", default-features = false, features = ["cjk"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_with = { version = "3.8", default-features = false, features = ["std", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "time", "process", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
rmcp = { version = "1.2", default-features = false, features = ["server", "transport-streamable-http-server", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tower-log"] }
async-trait = "0.1"
dirs = "6.0.0"
memchr = { version = "2", default-features = false, features = ["std"] }
aho-corasick = { version = "1", default-features = false, features = ["std", "perf-literal"] }
rayon = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
arboard = "3"
tempfile = "3.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
xz2 = { version = "0.1", default-features = false }
tar = { version = "0.4", default-features = false }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "logs"] }
prost = { version = "0.14", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport", "router"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
strum = { version = "0.28.0", features = ["derive"] }
schemars = { version = "0.8", default-features = false, features = ["derive", "preserve_order"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["rayon", "html_reports"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"
jsonschema = { version = "0.28", default-features = false }

[[bench]]
name = "file_reader"
harness = false

[[bench]]
name = "visible_lines"
harness = false

[[bench]]
name = "render_pipeline"
harness = false

[[bench]]
name = "headless"
harness = false

[profile.release]
debug = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
